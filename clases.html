<form class="cuadricula-formulario"> 
  <div>
    <label for="validationDefault01" style="font-weight: bold;">Nombre</label>
    <input type="text" class="form-control" id="" placeholder="Escriba su nombre">
  </div>
  <div>
    <label for="validationDefault02" style="font-weight: bold;">Apellido</label>
    <input type="text" class="form-control" id="" placeholder="Escriba su apellido">
  </div>
  <div>
    <label for="validationDefaultUsername" style="font-weight: bold;">Usuario</label>
    <input type="text" class="form-control" id="" placeholder="Escriba su usuario">
  </div>
  <div>
    <label for="validationDefault06" style="font-weight: bold;">Teléfono</label>

  </div>
  <div>
    <label for="validationDefault07" style="font-weight: bold;">Correo Electrónico</label>

  </div>
  <div>
    <label for="validationDefault08" style="font-weight: bold;">Contraseña</label>
    <input type="password" class="form-control" id="" placeholder="********">
