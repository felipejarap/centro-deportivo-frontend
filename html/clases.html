<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Centro deportivo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/clases.css">
    <link rel="stylesheet" href="/css/global.css">
  </head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-navbar py-2">
    <div class="container-fluid px-4">
      <a class="navbar-brand d-flex align-items-center gap-2 m-0" href="/index.html">
        <img src="/resources/logo.svg" alt="Logo" width="30" height="24" class="logo-white">
        <span class="fw-bold">KRONOFIT</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav mx-auto nav-center-modules my-2 my-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="/html/clases.html">Clases</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/html/profesores.html">Profesores</a>
          </li>
        </ul>
        <div class="d-flex align-items-center gap-2 mt-2 mt-lg-0">
          <a class="nav-link text-white text-decoration-none px-2" href="/html/login.html">Login</a>
          <a class="btn btn-primary btn-sm px-3 rounded-pill fw-semibold" href="/html/RegistroUsuarios.html">Registro</a>
        </div>
      </div>
    </div>
  </nav>

  <form class="cuadricula-formulario" id="formClase" novalidate> 
    
    <div class="campo-formulario">
      <label for="nombre" style="font-weight: bold;">Nombre</label>
      <input type="text" class="form-control" id="nombre" placeholder="Escriba el nombre de la clase">
      <small class="mensaje-error text-danger"><i class="bi bi-x-circle-fill me-1">X</i><span> </span></small>
    </div>

    <div class="campo-formulario">
      <label for="tipoClase" style="font-weight: bold;">Tipo clase</label>
      <input type="text" class="form-control" id="tipoClase" placeholder="Futbol, Basketball, Tenis">
      <small class="mensaje-error text-danger"><i class="bi bi-x-circle-fill me-1">X</i><span> </span></small>
    </div>

    <div class="campo-formulario">
      <label for="participantes" style="font-weight: bold;">Cantidad de participantes</label>
      <input type="number" class="form-control" id="participantes" placeholder="Escriba la cantidad de participantes">
      <small class="mensaje-error text-danger"><i class="bi bi-x-circle-fill me-1">X</i><span> </span></small>
    </div>

    <div class="campo-formulario">
      <label for="lugar" style="font-weight: bold;">Lugar</label>
      <input type="text" class="form-control" id="lugar" placeholder="Escriba el lugar">
  <small class="mensaje-error text-danger"><i class="bi bi-x-circle-fill me-1">X</i><span> </span></small>
    </div>

    <div class="campo-formulario">
      <label for="fechaInicio" style="font-weight: bold;">Fecha/Hora inicio</label>
      <input type="datetime-local" class="form-control" id="fechaInicio">
  <small class="mensaje-error text-danger"><i class="bi bi-x-circle-fill me-1">X</i><span> </span></small>
    </div>

    <div class="campo-formulario">
      <label for="fechaTermino" style="font-weight: bold;">Fecha/Hora termino</label>
      <input type="datetime-local" class="form-control" id="fechaTermino">
  <small class="mensaje-error text-danger"><i class="bi bi-x-circle-fill me-1">X</i><span> </span></small>
    </div>
    
    <!-- Sección inferior -->
    <div class="bloque-completo">
      <button class="btn-enviar" id="b" type="submit" >Guardar</button>
    </div>

  </form>

<div class="modal fade" id="modalExito" tabindex="-1" aria-labelledby="modalExitoLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content modal-deportivo">
      <!-- Cabecera en azul -->
      <div class="modal-header header-deportivo">
        <h5 class="modal-title" id="modalExitoLabel">¡Registro Exitoso!</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <!-- Cuerpo en blanco -->
      <div class="modal-body text-center py-4 body-deportivo">
        <p class="fs-5 texto-principal">La clase deportiva ha sido guardada correctamente en el sistema.</p>
        <p class="text-muted small">Ya puedes revisar la agenda del centro deportivo.</p>
      </div>
      <!-- Botón de cierre en azul -->
      <div class="modal-footer footer-deportivo">
        <button type="button" class="btn btn-azul-modal" data-bs-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>

<footer><small>&copy; 2026 Centro deportivo</small></footer>

<script src="/js/validacionClases.js"></script>

</body>
</html>
