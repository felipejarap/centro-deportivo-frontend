<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Usuario</title>
    <!-- Bootstrap CSS y Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/registroUsuario.css">
    <link rel="stylesheet" href="/css/global.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-navbar py-2">
    <div class="container-fluid px-4">
      <a class="navbar-brand d-flex align-items-center gap-2 m-0" href="/index.html">
        <img src="/resources/logo.svg" alt="Logo" width="30" height="24" class="logo-white">
        <span class="fw-bold">KRONOFIT</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav mx-auto nav-center-modules my-2 my-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="/html/clases.html">Clases</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/html/profesores.html">Profesores</a>
          </li>
        </ul>
        <div class="d-flex align-items-center gap-2 mt-2 mt-lg-0">
          <a class="nav-link text-white text-decoration-none px-2" href="/html/login.html">Login</a>
          <a class="btn btn-primary btn-sm px-3 rounded-pill fw-semibold" href="/html/RegistroUsuarios.html">Registro</a>
        </div>
      </div>
    </div>
  </nav>

  
  <div class="container mt-4 mb-5">
    <form class="cuadricula-formulario" id="formUsuario" novalidate> 
      
      <!-- Nombres -->
      <div class="campo-formulario mb-3">
          <label for="nombres" class="fw-bold mb-1">Nombres</label>
          <input type="text" class="form-control" id="nombres" placeholder="Escriba sus nombres">
          <div class="invalid-feedback mt-1">
              <i class="bi bi-x-circle-fill me-1"></i><span class="txt-error"></span>
          </div>
      </div>

      <!-- Apellidos -->
      <div class="campo-formulario mb-3">
        <label for="apellidos" class="fw-bold mb-1">Apellidos</label>
        <input type="text" class="form-control" id="apellidos" placeholder="Escriba sus apellidos">
        <div class="invalid-feedback">
           <i class="bi bi-x-circle-fill me-1"></i><span class="txt-error"></span>
        </div>
      </div>

      <!-- Edad -->
      <div class="campo-formulario mb-3">
          <label for="edad" class="fw-bold mb-1">Edad</label>
          <input type="text" class="form-control" id="edad" placeholder="Ingrese su edad">
          <div class="invalid-feedback mt-1">
              <i class="bi bi-x-circle-fill me-1"></i><span class="txt-error"></span>
          </div>
      </div>

      <!-- Fecha Nacimiento -->
      <div class="campo-formulario mb-3">
        <label for="fechaNacimiento" class="fw-bold mb-1">Fecha Nacimiento</label>
        <input type="date" class="form-control" id="fechaNacimiento">
        <div class="invalid-feedback">
            <i class="bi bi-x-circle-fill me-1"></i><span class="txt-error"></span>
        </div>
      </div>

      <!-- Rut -->
      <div class="campo-formulario mb-3">
        <label for="rut" class="fw-bold mb-1">RUT</label>
        <input type="text" class="form-control" id="rut" placeholder="Ej: 12345678-9">
        <div class="invalid-feedback">
          <i class="bi bi-x-circle-fill me-1"></i><span class="txt-error"></span>
        </div>
      </div>

      <!-- Sexo -->
      <div class="campo-formulario mb-3">
        <label class="fw-bold mb-2 d-block">Sexo</label>
        <div id="grupoSexo" class="d-flex align-items-center gap-3">
          <div class="form-check form-check-inline m-0">
            <input class="form-check-input radio-sexo" type="radio" name="sexo" id="sexoMasculino" value="masculino">
            <label class="form-check-label" for="sexoMasculino">Masculino</label>
          </div>
          <div class="form-check form-check-inline m-0">
            <input class="form-check-input radio-sexo" type="radio" name="sexo" id="sexoFemenino" value="femenino">
            <label class="form-check-label" for="sexoFemenino">Femenino</label>
          </div>
          <div class="form-check form-check-inline m-0">
            <input class="form-check-input radio-sexo" type="radio" name="sexo" id="sexoOtro" value="otro">
            <label class="form-check-label" for="sexoOtro">Otro</label>
          </div>
         </div>
         <div class="invalid-feedback"></div>
      </div>

      <!-- Correo Electrónico -->
      <div class="campo-formulario mb-3">
        <label for="correo" class="fw-bold mb-1">Dirección de correo electrónico</label>
        <input type="email" class="form-control" id="correo" placeholder="ejemplo@correo.com">
        <div class="invalid-feedback">
          <i class="bi bi-x-circle-fill me-1"></i><span class="txt-error"></span>
        </div>
      </div>

      <!-- Clases -->
      <div class="campo-formulario mb-3">
        <label class="fw-bold mb-2 d-block">Clases de preferencia</label>
        <div id="grupoClases" class="row row-cols-1 row-cols-sm-2 g-2">
          <div class="col">
            <div class="form-check">
              <input class="form-check-input check-clase" type="checkbox" value="yoga" id="claseYoga">
              <label class="form-check-label" for="claseYoga">Yoga</label>
            </div>
          </div>
          <div class="col">
            <div class="form-check">
              <input class="form-check-input check-clase" type="checkbox" value="pilates" id="clasePilates">
              <label class="form-check-label" for="clasePilates">Pilates</label>
            </div>
          </div>
          <div class="col">
            <div class="form-check">
              <input class="form-check-input check-clase" type="checkbox" value="crossfit" id="claseCrossfit">
              <label class="form-check-label" for="claseCrossfit">Crossfit</label>
            </div>
          </div>
          <div class="col">
            <div class="form-check">
              <input class="form-check-input check-clase" type="checkbox" value="spinning" id="claseSpinning">
              <label class="form-check-label" for="claseSpinning">Spinning</label>
            </div>
          </div>
          <div class="col">
            <div class="form-check">
              <input class="form-check-input check-clase" type="checkbox" value="futbol" id="claseFutbol">
              <label class="form-check-label" for="claseFutbol">Fútbol</label>
            </div>
          </div>
          <div class="col">
            <div class="form-check">
              <input class="form-check-input check-clase" type="checkbox" value="basquetball" id="claseBasquetball">
              <label class="form-check-label" for="claseBasquetball">Básquetbol</label>
            </div>
          </div>
          <div class="col">
            <div class="form-check">
              <input class="form-check-input check-clase" type="checkbox" value="boxeo" id="claseBoxeo">
              <label class="form-check-label" for="claseBoxeo">Boxeo</label>
            </div>
          </div>
          <div class="col">
            <div class="form-check">
              <input class="form-check-input check-clase" type="checkbox" value="voleyball" id="claseVoleyball">
              <label class="form-check-label" for="claseVoleyball">Vóleybol</label>
            </div>
          </div>
        </div>
      </div>

      <!-- Horario preferido -->
      <div class="campo-formulario mb-4">
        <label class="fw-bold mb-2 d-block">Horario de preferencia</label>
        <div id="grupoHorario" class="d-flex align-items-center gap-3">
          <div class="form-check form-check-inline m-0">
            <input class="form-check-input" type="radio" name="horario" id="horarioManana" value="manana">
            <label class="form-check-label" for="horarioManana">Mañana</label>
          </div>
          <div class="form-check form-check-inline m-0">
            <input class="form-check-input" type="radio" name="horario" id="horarioTarde" value="tarde">
            <label class="form-check-label" for="horarioTarde">Tarde</label>
          </div>
          <div class="form-check form-check-inline m-0">
            <input class="form-check-input" type="radio" name="horario" id="horarioNoche" value="noche">
            <label class="form-check-label" for="horarioNoche">Noche</label>
           </div>
          </div>
        <div class="invalid-feedback"></div>  

      </div>
      

      <!-- Botón de Envío -->
      <div class="bloque-completo mt-4">
        <button class="btn btn-primary btn-enviar px-4 py-2" id="btnGuardar" type="submit">Guardar</button>
      </div>

    </form>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/validacionRegistro.js"></script>

</body>
</html>
