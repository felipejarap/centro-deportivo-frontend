<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/profesores.css">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Registrar Profesor</title>
</head>
<body>

    <div id="navbar-container"></div>

    <main class="container my-4" style="max-width: 900px; font-family: 'Inter' ">
        
        <div class="mb-4">
            <h4 class="fw-bold text-dark m-0">Registrar Nuevo Profesor</h4>
            <p class="text-secondary mt-1 mb-0">Completa la información del instructor</p>
        </div>

        <form class="bg-white p-4 p-md-5 rounded-4 shadow-sm">
            <div class="row g-3">
                
            <div class="col-12 col-md-6">
                <label for="nombreProfesor" class="form-label fw-bold">Nombre</label>
                <input type="text" class="form-control" id="nombreProfesor" placeholder="Ej: Julian">
            </div>

            <div class="col-12 col-md-6">
                <label for="apellidoProfesor" class="form-label fw-bold">Apellido</label>
                <input type="text" class="form-control" id="apellidoProfesor" placeholder="Ej: Hidalgo">
            </div>

            <div class="col-12 col-md-6">
                <label for="correoProfesor" class="form-label fw-bold">Correo</label>
                <input type="email" class="form-control" id="correoProfesor" placeholder="correo@kronofit.cl">
            </div>

            <div class="col-12 col-md-6">
                <label for="telefonoProfesor" class="form-label fw-bold">Teléfono</label>
                <input type="tel" class="form-control" id="telefonoProfesor" placeholder="+56 9 1234 5678">
            </div>

            <div class="col-12 col-md-6">
                <label for="especialidadProfesor" class="form-label fw-bold">Disciplina Principal</label>
                <select class="form-select" id="especialidadProfesor">
                    <option selected disabled value="">Seleccionar disciplina...</option>
                    <option value="crossfit">Calistenia</option>
                    <option value="spinning">Spinning</option>
                    <option value="funcional">Entrenamiento Funcional</option>
                    <option value="boxeo">Boxeo</option>
                    <option value="yoga">Yoga</option>
                </select>
            </div>

            <div class="col-12 d-flex flex-column flex-sm-row justify-content-sm-end gap-2 gap-sm-3 pt-2">
                <a href="/index.html" class="btn btn-outline-danger px-4 fw-semibold text-center">Cancelar</a>
                <button type="submit" class="btn btn-primary px-5 fw-semibold">Guardar</button>
            </div>
        </div>
        </form>
    </main>
</body>
<script src="/js/navbar.js"></script>
</html>
