<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/profesores.css">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Registrar Profesor</title>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-navbar py-2">
        <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center gap-2 m-0" href="/index.html">
            <img src="/resources/logo.svg" alt="Logo" width="30" height="24" class="logo-white">
            <span class="fw-bold">KRONOFIT</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mx-auto nav-center-modules my-2 my-lg-0">
            <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="/html/clases.html">Clases</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/html/profesores.html">Profesores</a>
            </li>
            </ul>
            <div class="d-flex align-items-center gap-2 mt-2 mt-lg-0">
            <a class="nav-link text-white text-decoration-none px-2" href="/html/login.html">Login</a>
            <a class="btn btn-primary btn-sm px-3 rounded-pill fw-semibold" href="/html/RegistroUsuarios.html">Registro</a>
            </div>
        </div>
        </div>
    </nav>

    <main class="container my-4" style="max-width: 900px; font-family: 'Inter' ">
        
        <div class="mb-4">
            <h4 class="fw-bold text-dark m-0">Registrar Nuevo Profesor</h4>
            <p class="text-secondary mt-1 mb-0">Completa la información del instructor</p>
        </div>

        <form class="bg-white p-4 p-md-5 rounded-4 shadow-sm">
            <div class="row g-3">
                
            <div class="col-12 col-md-6">
                <label for="nombreProfesor" class="form-label fw-bold">Nombre</label>
                <input type="text" class="form-control" id="nombreProfesor" placeholder="Ej: Julian">
            </div>

            <div class="col-12 col-md-6">
                <label for="apellidoProfesor" class="form-label fw-bold">Apellido</label>
                <input type="text" class="form-control" id="apellidoProfesor" placeholder="Ej: Hidalgo">
            </div>

            <div class="col-12 col-md-6">
                <label for="apellidoProfesor" class="form-label fw-bold">RUT</label>
                <input type="text" class="form-control" id="apellidoProfesor" placeholder="Ej: Hidalgo">
            </div>

            <div class="col-12 col-md-6">
                <label for="correoProfesor" class="form-label fw-bold">Correo</label>
                <input type="email" class="form-control" id="correoProfesor" placeholder="correo@kronofit.cl">
            </div>

            <div class="col-12 col-md-6">
                <label for="telefonoProfesor" class="form-label fw-bold">Teléfono</label>
                <input type="tel" class="form-control" id="telefonoProfesor" placeholder="+56 9 1234 5678">
            </div>

            <div class="col-12 col-md-6">
                <label for="especialidadProfesor" class="form-label fw-bold">Disciplina Principal</label>
                <select class="form-select" id="especialidadProfesor">
                    <option selected disabled value="">Seleccionar disciplina...</option>
                    <option value="crossfit">Calistenia</option>
                    <option value="spinning">Spinning</option>
                    <option value="funcional">Entrenamiento Funcional</option>
                    <option value="boxeo">Boxeo</option>
                    <option value="yoga">Yoga</option>
                </select>
            </div>

            <div class="col-12 d-flex flex-column flex-sm-row justify-content-sm-end gap-2 gap-sm-3 pt-2">
                <a href="/index.html" class="btn btn-outline-danger px-4 fw-semibold text-center">Cancelar</a>
                <button type="submit" class="btn btn-primary px-5 fw-semibold">Guardar</button>
            </div>
        </div>
        </form>
    </main>
</body>
<script src="/js/navbar.js"></script>
</html>
