<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | KRONOFIT</title>
    <!-- Bootstrap CSS y Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/global.css">
</head>
<body class="pagina-login">

  <nav class="navbar navbar-expand-lg navbar-dark bg-navbar py-2">
    <div class="container-fluid px-4">
      <a class="navbar-brand d-flex align-items-center gap-2 m-0" href="/index.html">
        <img src="/resources/logo.svg" alt="Logo" width="30" height="24" class="logo-white">
        <span class="fw-bold">KRONOFIT</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav mx-auto nav-center-modules my-2 my-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="/html/clases.html">Clases</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/html/profesores.html">Profesores</a>
          </li>
        </ul>
        <div class="d-flex align-items-center gap-2 mt-2 mt-lg-0">
          <a class="nav-link text-white text-decoration-none px-2" href="/html/login.html">Login</a>
          <a class="btn btn-primary btn-sm px-3 rounded-pill fw-semibold" href="/html/RegistroUsuarios.html">Registro</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="contenedor-login">
    <div class="tarjeta-login">

      <h1 class="titulo-login">Iniciar sesión</h1>

      <p class="texto-cuenta">
        ¿Necesitas cuenta  en KRONOFIT?
        <a href="/html/RegistroUsuarios.html">Crear una cuenta</a>
      </p>

      <form id="formLogin" novalidate>

        <div class="campo-formulario mb-3">
          <label for="usuario" class="fw-bold mb-1">Usuario o correo</label>
          <input type="text" class="form-control" id="usuario" autocomplete="username">
          <small class="mensaje-error text-danger">
            <i class="bi bi-x-circle-fill me-1"></i><span></span>
          </small>
        </div>

        <!-- Contraseña -->
        <div class="campo-formulario mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="password" class="fw-bold mb-0">Contraseña</label>
            <button type="button" class="btn-mostrar" id="btnMostrarPassword" aria-pressed="false">
              <i class="bi bi-eye" id="iconoPassword"></i>
              
            </button>
          </div>
          <input type="password" class="form-control" id="password" autocomplete="current-password">
          <small class="mensaje-error text-danger">
            <i class="bi bi-x-circle-fill me-1"></i><span></span>
          </small>
        </div>

      
        <div class="alert alert-danger d-none py-2" id="errorGeneral" role="alert"></div>

        <!-- Botón -->
        <button type="submit" class="btn btn-primary rounded-pill fw-bold px-4 py-2" id="btnLogin">
          Iniciar sesión
        </button>

      </form>

      <div class="enlaces-ayuda">
        <div class="mb-2">
          <a href="#">¿Olvidaste tu usuario?</a>
          <a href="#" class="ms-3">¿Olvidaste tu contraseña?</a>
        </div>
        <a href="#">¿No puedes iniciar sesión?</a>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/validacionLogin.js"></script>
  <script src="/js/navbar.js"></script>
</body>
</html>
